# @package task
# Generated by pipeline/scripts/make_task_cfg.py -- tune the contact offsets and
# randomization ranges before training.
defaults:
  - base/hdmi-base
  - _self_

name: G1WallPainting2Z

viewer:
  env_spacing: 5.0
  lookat: [0., 0., 0.5]
  eye: [0.0, 3.0, 1.5]

robot:
  name: g1
  robot_type: g1_29dof_rubberhand-feet_sphere-eef_box-body_capsule

command:
  data_path: data/motion/data_for_sim/wall_painting2
  root_body_name: "pelvis"
  object_asset_name: "roller"
  object_body_name:  "roller"

  # Randomize where the object starts, so the policy does not memorize one pose.
  object_pose_range:
    x: [-0.05, 0.05]
    y: [-0.05, 0.05]

  # Desired contact points, in the OBJECT's local frame (one per end-effector).
  contact_target_pos_offset:
    - [0.0, 0, -0.197]   # left  -- left_wrist_yaw_link sits at local z -0.1967
    - [0.0, 0, -0.700]   # right -- right_wrist_yaw_link sits at local z -0.6998
  # Which point on each end-effector does the touching, in the EEF's local frame.
  contact_eef_pos_offset:
    - [0.05, 0.0, 0.0]   # left
    - [0.05, 0.0, 0.0]   # right

  # Wall-painting target region
  target_region_path: "pipeline/task_info/wall_painting2/paint_target_rectangle.npz"
  # Move the GOAL while the reference stays put. The demonstrated roller head
  # sweeps z = 0.796 .. 1.649 m with the pelvis fixed at 0.809 m, so +-0.15 m
  # is what a standing policy can reach WITHOUT changing posture. +-0.5 m is
  # deliberately past that: it puts the target between 0.296 and 2.149 m, which
  # needs a squat at the bottom and is out of reach at the top from a fixed
  # stance. That is the point -- it measures where one posture stops working,
  # which is the number that says whether the bend/squat clips are needed.
  # Do not go past +-0.6: at -0.7 the target bottom passes through the floor.
  target_region_pos_range:
    x: [0.0, 0.0]
    y: [0.0, 0.0]
    z: [-0.5, 0.5]
  target_region_scale_range:
    width: [1.0, 1.0]
    height: [0.70, 1.40]
  # Coarse coverage map given to the policy.
  coverage_grid_size: 4

observation:
  object:
    target_region_size: {}
    roller_head_uv: {}
    paint_coverage_grid: {}
    # Where the target is relative to the root. roller_head_uv only becomes an
    # error signal once the roller is already at the wall, which is not enough
    # when the target itself moves. Comment out to run the ablation.
    target_center_b: {}

reward:
  object_tracking:
    eef_contact_exp: {weight: 0.5}

  task:
    paint_coverage_delta:
      weight: 400.0

  # Unweighted mirror, not added to the return. Its episode-accumulated stat
  # reads directly as the final coverage ratio, which is what the z-sweep plots.
  debug:
    paint_coverage:
      weight: 1.0
      enabled: false
    # Paint outside the target (IoU = cov / (1 + out)), painting steps, and the
    # roller's distance from the wall while painting (total / paint_steps).
    # Read-only like paint_coverage; outside paint needs track_wall_paint,
    # which is on by default below 257 envs.
    paint_outside: {weight: 1.0, enabled: false}
    paint_steps: {weight: 1.0, enabled: false}
    paint_wall_dist: {weight: 1.0, enabled: false}

randomization:
  object_body_randomization:
    static_dynamic_friction_ratio_range: [1.0, 2.0]
    dynamic_friction_range: [0.3, 0.8]
    restitution_range: [0.0, 0.2]
    mass_range: [1.0, 2.0]

  body_scale:
    name: "roller"
    scale_range: [1.0, 1.0]
