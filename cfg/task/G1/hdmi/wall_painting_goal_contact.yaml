# @package task
# Generated by pipeline/scripts/make_task_cfg.py -- tune the contact offsets and
# randomization ranges before training.
defaults:
  - base/hdmi-base
  - _self_

name: G1WallPaintingGoalContact

viewer:
  env_spacing: 5.0
  lookat: [0., 0., 0.5]
  eye: [0.0, 3.0, 1.5]

robot:
  name: g1
  robot_type: g1_29dof_rubberhand-feet_sphere-eef_box-body_capsule

command:
  data_path: data/motion/data_for_sim/wall_painting2
  root_body_name: "pelvis"
  object_asset_name: "roller"
  object_body_name:  "roller"

  # Randomize where the object starts, so the policy does not memorize one pose.
  object_pose_range:
    x: [-0.05, 0.05]
    y: [-0.05, 0.05]

  # Desired contact points, in the OBJECT's local frame (one per end-effector).
  contact_target_pos_offset:
    - [0.0, 0, -0.197]   # left  -- left_wrist_yaw_link sits at local z -0.1967
    - [0.0, 0, -0.700]   # right -- right_wrist_yaw_link sits at local z -0.6998
  # Which point on each end-effector does the touching, in the EEF's local frame.
  contact_eef_pos_offset:
    - [0.05, 0.0, 0.0]   # left
    - [0.05, 0.0, 0.0]   # right

  # Wall-painting target region
  target_region_path: "pipeline/task_info/wall_painting2/paint_target_rectangle.npz"

  # wall_painting_goal with a solid wall and contact-gated paint. The canvas
  # collides (canvas_collide), and a sweep counts as paint only while the
  # roller presses on the wall with >= paint_force_min N at both ends of the
  # step. wall_painting_goal counted the roller's projection at any distance,
  # and its policies painted from 1.4-3.5 cm off the wall or 4 cm inside it
  # (DOC_wall_painting_stages.md, 2026-10-01). The wall also shifts +-2 cm
  # along its normal per episode. Observations are unchanged, so
  # wall_painting_goal checkpoints load here.
  wall_collision: true
  paint_gate: force
  paint_force_min: 2.0
  wall_normal_offset_range: [-0.02, 0.02]
  # Goal-conditioned: the region to paint moves and resizes on the wall, and
  # the reference motion does not change. This is the setup that asks whether
  # the coverage objective buys anything the demonstration alone cannot.
  #
  # World xyz stays pinned -- moving in world x/y would push the region off
  # the wall plane (normal [0.879, 0.477, 0]).
  target_region_pos_range:
    x: [0.0, 0.0]
    y: [0.0, 0.0]
    z: [0.0, 0.0]

  # In-plane slide along the wall. u is the in-plane horizontal, v is vertical.
  # +-0.35 u keeps a 0.60 m region inside the 2.0 m wall with room to spare;
  # +-0.40 v puts the region between 0.40 and 2.05 m, which spans from squat
  # height to above a standing reach.
  target_region_uv_range:
    u: [-0.35, 0.35]
    v: [-0.40, 0.40]

  # Region size. 0.7x to 1.3x the demonstrated 0.6025 x 0.8529 m.
  target_region_scale_range:
    width: [0.7, 1.3]
    height: [0.7, 1.3]
  # Coarse coverage map given to the policy.
  coverage_grid_size: 4

observation:
  object:
    target_region_size: {}
    roller_head_uv: {}
    paint_coverage_grid: {}
    # Required once the target moves: roller_head_uv only becomes an error
    # signal when the roller is already at the wall, which is too late if the
    # region could be anywhere. This changes the object obs from 30 to 33, so
    # a checkpoint trained without it cannot be loaded into this task.
    target_center_b: {}

reward:
  object_tracking:
    # Product over the two hands instead of a mean, so a one-handed grip scores
    # zero rather than half. The mean version lets the policy settle into
    # holding the roller with one hand and parking the other on the hip --
    # contact per step plateaus around 0.35 against a one-handed ceiling of 0.5.
    # Peak value is still `gain`, so the weight carries over unchanged.
    eef_contact_exp: {weight: 0.0, enabled: false}
    eef_contact_exp_both: {weight: 0.5, gain: 5.0, pos_sigma: 0.3, frc_sigma: 40.0, frc_thres: 10.0}

  task:
    paint_coverage_delta:
      weight: 400.0

  # Read-only indicators. Divide the accumulated stat by episode_len for a
  # per-step fraction; eef_contact_both is 0 unless BOTH hands are on.
  debug:
    eef_contact_both:
      weight: 1.0
      enabled: false
    paint_coverage:
      weight: 1.0
      enabled: false
    # Paint outside the target (IoU = cov / (1 + out)), painting steps, and the
    # roller's distance from the wall while painting (total / paint_steps).
    # Read-only like paint_coverage; outside paint needs track_wall_paint,
    # which is on by default below 257 envs.
    paint_outside: {weight: 1.0, enabled: false}
    paint_steps: {weight: 1.0, enabled: false}
    paint_wall_dist: {weight: 1.0, enabled: false}
    paint_wall_force: {weight: 1.0, enabled: false}

randomization:
  object_body_randomization:
    static_dynamic_friction_ratio_range: [1.0, 2.0]
    dynamic_friction_range: [0.3, 0.8]
    restitution_range: [0.0, 0.2]
    mass_range: [1.0, 2.0]

  body_scale:
    name: "roller"
    scale_range: [1.0, 1.0]
